services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: newswatch
      POSTGRES_PASSWORD: newswatch
      POSTGRES_DB: newswatch
    volumes:
      - db_data:/var/lib/postgresql/data
    # Uncomment to reach Postgres from the host for debugging (e.g. psql, a GUI client).
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newswatch -d newswatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://newswatch:newswatch@db:5432/newswatch
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://newswatch:newswatch@db:5432/newswatch
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FINNHUB_KEY: ${FINNHUB_KEY:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      BIGDATA_API_KEY: ${BIGDATA_API_KEY:-}
      TZ: Asia/Bangkok
    volumes:
      - ./worker:/app

volumes:
  db_data:
  web_node_modules:
