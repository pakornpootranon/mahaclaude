[project]
name = "newswatch-worker"
version = "0.1.0"
description = "newswatch digest-cycle worker: ingestion, LLM pipeline, rules, Polymarket, outcomes"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "anthropic>=0.40",
  "mcp>=1.1",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "yfinance>=0.2.43",
  "feedparser>=6.0",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
]

[project.scripts]
newswatch = "newswatch_worker.main:cli"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "uvicorn>=0.30",  # serves the local test MCP server in tests/conftest.py
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newswatch_worker"]
